services:
  postgres:
    image: postgres:17-alpine
    container_name: collaby-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: collaby
      POSTGRES_PASSWORD: collaby
      POSTGRES_DB: collaby
    ports:
      - '5432:5432'
    volumes:
      - collaby-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collaby -d collaby']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  collaby-postgres-dev:
